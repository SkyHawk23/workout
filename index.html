<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useCallback, useRef} = React;

// ── Constants ─────────────────────────────────────────────────────────────────
const TABS = ["Log","History","Progress","Records","Templates","AI Workout","Settings"];
const TAB_ICON = {Log:"📝",History:"📊",Progress:"📈",Records:"🏆",Templates:"📋","AI Workout":"🤖",Settings:"⚙️"};
const todayStr = () => new Date().toISOString().slice(0,10);
const genId    = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

const DEFAULT_PEOPLE    = ["Alice","Bob"];
const DEFAULT_EXERCISES = ["Bench Press","Squat","Deadlift","Overhead Press","Barbell Row","Pull-up"];

// ── IndexedDB layer ──────────────────────────────────────────────────────────
const DB_NAME    = "WorkoutTrackerDB";
const DB_VERSION = 1;
const STORE_WORKOUTS    = "workouts";
const STORE_TEMPLATES   = "templates";
const STORE_AI_WORKOUTS = "aiWorkouts";
const STORE_KV          = "kv";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_WORKOUTS))    db.createObjectStore(STORE_WORKOUTS, {keyPath:"id"});
      if (!db.objectStoreNames.contains(STORE_TEMPLATES))   db.createObjectStore(STORE_TEMPLATES, {keyPath:"id"});
      if (!db.objectStoreNames.contains(STORE_AI_WORKOUTS)) db.createObjectStore(STORE_AI_WORKOUTS, {keyPath:"id"});
      if (!db.objectStoreNames.contains(STORE_KV))          db.createObjectStore(STORE_KV);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

async function idbGetAll(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

async function idbGet(storeName, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

async function idbPut(storeName, value, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    if (key !== undefined) tx.objectStore(storeName).put(value, key);
    else tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror    = () => reject(tx.error);
  });
}

async function idbPutMany(storeName, values) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    values.forEach(v => store.put(v));
    tx.oncomplete = () => resolve();
    tx.onerror    = () => reject(tx.error);
  });
}

async function idbDelete(storeName, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror    = () => reject(tx.error);
  });
}

async function idbClear(storeName) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).clear();
    tx.oncomplete = () => resolve();
    tx.onerror    = () => reject(tx.error);
  });
}

function dedupe(arr) { return [...new Set(arr.filter(Boolean))]; }

// ── Claude AI integration ───────────────────────────────────────────────────
async function generateWorkoutWithClaude(apiKey, preferences) {
  const prompt = `You are a professional fitness coach. Generate a customized workout routine based on these preferences:

Fitness Level: ${preferences.fitnessLevel}
Time Available: ${preferences.timeAvailable} minutes
Goal: ${preferences.goal}
Equipment: ${preferences.equipment}
Focus Area: ${preferences.focusArea}
Special Notes: ${preferences.notes || "None"}

Generate a complete workout in this exact JSON format (no markdown, just JSON):
{
  "title": "Brief workout name",
  "warmup": [
    {"name": "Exercise name", "duration": "5 min", "description": "Description", "videoQuery": "search term for YouTube"}
  ],
  "main": [
    {"name": "Exercise name", "sets": 3, "reps": "8-10", "description": "Form cues", "videoQuery": "search term for YouTube"}
  ],
  "cooldown": [
    {"name": "Stretch name", "duration": "2 min", "description": "Description"}
  ],
  "notes": "Any safety tips or modifications"
}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json",
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 1500,
      messages: [
        { role: "user", content: prompt }
      ],
    }),
  });

  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.error?.message || "Claude API error");
  }

  const data = await response.json();
  const textContent = data.content[0].text;

  const jsonMatch = textContent.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error("Invalid response format");

  return JSON.parse(jsonMatch[0]);
}

// ── Styles ────────────────────────────────────────────────────────────────────
const S = {
  page:        {maxWidth:480,margin:"0 auto",background:"#0f172a",minHeight:"100vh"},
  header:      {background:"#1e293b",padding:"14px 16px 0",position:"sticky",top:0,zIndex:10,boxShadow:"0 2px 8px rgba(0,0,0,.4)"},
  headerTop:   {display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10},
  title:       {color:"#38bdf8",fontSize:18,fontWeight:700},
  tabs:        {display:"flex",gap:2,overflowX:"auto",paddingBottom:0},
  tab:    (a) =>({padding:"8px 10px",borderRadius:"6px 6px 0 0",border:"none",cursor:"pointer",
                  background:a?"#0f172a":"transparent",color:a?"#38bdf8":"#94a3b8",fontWeight:a?700:400,fontSize:12,whiteSpace:"nowrap"}),
  body:        {padding:16,paddingBottom:40},
  card:        {background:"#1e293b",borderRadius:8,padding:10,marginBottom:8},
  cardAI:      {background:"#1e293b",borderRadius:8,padding:14,marginBottom:12,borderLeft:"3px solid #8b5cf6",cursor:"pointer"},
  row:         {display:"flex",gap:8},
  label:       {fontSize:11,color:"#64748b",marginBottom:3},
  input:       {width:"100%",background:"#334155",border:"1px solid #475569",borderRadius:6,padding:"9px 10px",color:"#e2e8f0",fontSize:14,outline:"none"},
  select:      {width:"100%",background:"#334155",border:"1px solid #475569",borderRadius:6,padding:"9px 10px",color:"#e2e8f0",fontSize:14,outline:"none"},
  btnPrimary:  {background:"#0ea5e9",border:"none",color:"#fff",borderRadius:8,padding:"12px",width:"100%",fontWeight:700,fontSize:15,cursor:"pointer"},
  btnGhost:    {background:"none",border:"1px solid #334155",color:"#94a3b8",borderRadius:6,padding:"6px 12px",cursor:"pointer",fontSize:13},
  btnDanger:   {background:"none",border:"1px solid #334155",color:"#f87171",borderRadius:6,padding:"6px 12px",cursor:"pointer",fontSize:13},
  sectionTitle:{fontWeight:700,color:"#cbd5e1",fontSize:15,margin:"0 0 10px"},
  empty:       {textAlign:"center",color:"#475569",marginTop:40,fontSize:14},
  toggle: (a) => ({flex:1,padding:"9px",borderRadius:8,border:a?"none":"1px solid #334155",
                    background:a?"#8b5cf6":"transparent",color:a?"#fff":"#94a3b8",fontWeight:a?700:400,cursor:"pointer"}),
};

function Label({children})          { return <div style={S.label}>{children}</div>; }
function Inp({style,...p})          { return <input {...p} style={{...S.input,...style}}/>; }
function Sel({style,children,...p}) { return <select {...p} style={{...S.select,...style}}>{children}</select>; }
function Spinner({text="Loading…"}) { return <div style={{textAlign:"center",padding:40,color:"#38bdf8",fontSize:14}}>{text}</div>; }

function Modal({title,children,onClose}) {
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#1e293b",borderRadius:"16px 16px 0 0",padding:20,width:"100%",maxWidth:480,margin:"0 auto",maxHeight:"75vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <strong style={{fontSize:15}}>{title}</strong>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#94a3b8",fontSize:22,cursor:"pointer",lineHeight:1}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

const emptySet = (exercises) => ({id:genId(), exercise:exercises[0]||"", weight:"", reps:""});

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]         = useState(0);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState("");
  const [status, setStatus]   = useState(null);
  const [data, setData]       = useState({workouts:[], people:DEFAULT_PEOPLE, exercises:DEFAULT_EXERCISES, templates:[], aiWorkouts:[]});
  const [apiKey, setApiKey]   = useState(() => sessionStorage.getItem("claudeApiKey") || "");
  const [importPending, setImportPending] = useState(null);

  const showStatus = (s) => { setStatus(s); setTimeout(()=>setStatus(null), s==="error"?4000:2000); };

  const load = useCallback(async () => {
    setLoading(true); setError("");
    try {
      const [workouts, templates, aiWorkouts, people, exercises] = await Promise.all([
        idbGetAll(STORE_WORKOUTS),
        idbGetAll(STORE_TEMPLATES),
        idbGetAll(STORE_AI_WORKOUTS),
        idbGet(STORE_KV, "people"),
        idbGet(STORE_KV, "exercises"),
      ]);
      const finalPeople    = (people && people.length) ? people : DEFAULT_PEOPLE;
      const finalExercises = (exercises && exercises.length) ? exercises : DEFAULT_EXERCISES;
      if (!people)    await idbPut(STORE_KV, finalPeople, "people");
      if (!exercises) await idbPut(STORE_KV, finalExercises, "exercises");
      setData({workouts, templates, aiWorkouts, people:finalPeople, exercises:finalExercises});
    } catch (e) {
      setError(e.message);
    }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  // ── Workouts ──
  const saveWorkout = async (workout) => {
    setData(d => ({...d, workouts:[...d.workouts, workout]}));
    showStatus("saving");
    try { await idbPut(STORE_WORKOUTS, workout); showStatus("ok"); }
    catch (e) { showStatus("error"); setData(d => ({...d, workouts:d.workouts.filter(w=>w.id!==workout.id)})); }
  };

  const deleteWorkout = async (id) => {
    const prev = data.workouts;
    setData(d => ({...d, workouts:d.workouts.filter(w=>w.id!==id)}));
    try { await idbDelete(STORE_WORKOUTS, id); showStatus("ok"); }
    catch (e) { showStatus("error"); setData(d => ({...d, workouts:prev})); }
  };

  // ── People / Exercises ──
  const savePeople = async (list) => {
    setData(d => ({...d, people:list}));
    try { await idbPut(STORE_KV, list, "people"); } catch (e) { showStatus("error"); }
  };
  const saveExercises = async (list) => {
    setData(d => ({...d, exercises:list}));
    try { await idbPut(STORE_KV, list, "exercises"); } catch (e) { showStatus("error"); }
  };

  // ── Templates ──
  const saveTemplates = async (list) => {
    setData(d => ({...d, templates:list}));
    try { await idbClear(STORE_TEMPLATES); await idbPutMany(STORE_TEMPLATES, list); }
    catch (e) { showStatus("error"); }
  };

  // ── AI Workouts ──
  const saveAiWorkout = async (entry) => {
    setData(d => ({...d, aiWorkouts:[...d.aiWorkouts, entry]}));
    try { await idbPut(STORE_AI_WORKOUTS, entry); }
    catch (e) { showStatus("error"); setData(d => ({...d, aiWorkouts:d.aiWorkouts.filter(w=>w.id!==entry.id)})); }
  };
  const deleteAiWorkout = async (id) => {
    const prev = data.aiWorkouts;
    setData(d => ({...d, aiWorkouts:d.aiWorkouts.filter(w=>w.id!==id)}));
    try { await idbDelete(STORE_AI_WORKOUTS, id); }
    catch (e) { showStatus("error"); setData(d => ({...d, aiWorkouts:prev})); }
  };

  // ── Export / Import ──
  const handleExport = () => {
    const payload = {
      app: "workout-tracker", version: 1, exportedAt: new Date().toISOString(),
      workouts: data.workouts, people: data.people, exercises: data.exercises,
      templates: data.templates, aiWorkouts: data.aiWorkouts,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `workouts-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleImportFile = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (typeof parsed !== "object" || parsed === null) throw new Error("Not a valid backup file");
        setImportPending(parsed);
      } catch (e) {
        alert("Could not read backup file: " + e.message);
      }
    };
    reader.onerror = () => alert("Could not read file");
    reader.readAsText(file);
  };

  const runImport = async (mode) => {
    const p = importPending;
    if (!p) return;
    const wk  = Array.isArray(p.workouts) ? p.workouts : [];
    const tpl = Array.isArray(p.templates) ? p.templates : [];
    const ai  = Array.isArray(p.aiWorkouts) ? p.aiWorkouts : [];
    const ppl = Array.isArray(p.people) ? p.people : [];
    const exs = Array.isArray(p.exercises) ? p.exercises : [];
    try {
      if (mode === "replace") {
        await idbClear(STORE_WORKOUTS); await idbClear(STORE_TEMPLATES); await idbClear(STORE_AI_WORKOUTS);
        await idbPutMany(STORE_WORKOUTS, wk);
        await idbPutMany(STORE_TEMPLATES, tpl);
        await idbPutMany(STORE_AI_WORKOUTS, ai);
        await idbPut(STORE_KV, ppl.length ? ppl : DEFAULT_PEOPLE, "people");
        await idbPut(STORE_KV, exs.length ? exs : DEFAULT_EXERCISES, "exercises");
      } else {
        await idbPutMany(STORE_WORKOUTS, wk);
        await idbPutMany(STORE_TEMPLATES, tpl);
        await idbPutMany(STORE_AI_WORKOUTS, ai);
        await idbPut(STORE_KV, dedupe([...data.people, ...ppl]), "people");
        await idbPut(STORE_KV, dedupe([...data.exercises, ...exs]), "exercises");
      }
      setImportPending(null);
      await load();
      showStatus("ok");
      alert(mode === "replace" ? "Data replaced from backup." : "Backup merged in.");
    } catch (e) {
      showStatus("error");
      alert("Import failed: " + e.message);
    }
  };

  const handleClearAll = async () => {
    if (!confirm("Delete ALL workouts, templates, and AI workout history? This cannot be undone.")) return;
    try {
      await idbClear(STORE_WORKOUTS); await idbClear(STORE_TEMPLATES); await idbClear(STORE_AI_WORKOUTS);
      await idbPut(STORE_KV, DEFAULT_PEOPLE, "people");
      await idbPut(STORE_KV, DEFAULT_EXERCISES, "exercises");
      await load();
      showStatus("ok");
    } catch (e) { showStatus("error"); }
  };

  const StatusBar = () => {
    if (!status) return null;
    const cfg = {saving:{color:"#fbbf24",text:"Saving…"},ok:{color:"#4ade80",text:"✓ Saved"},error:{color:"#f87171",text:"✗ Save failed"}};
    const c = cfg[status];
    return <div style={{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",
      background:"#1e293b",border:`1px solid ${c.color}`,color:c.color,borderRadius:20,
      padding:"8px 18px",fontSize:13,zIndex:200,boxShadow:"0 4px 12px rgba(0,0,0,.4)",whiteSpace:"nowrap"}}>{c.text}</div>;
  };

  return (
    <div style={S.page}>
      <div style={S.header}>
        <div style={S.headerTop}>
          <span style={S.title}>💪 Workout Tracker</span>
          <span style={{fontSize:11,color:"#475569"}}>offline · on-device</span>
        </div>
        <div style={S.tabs}>
          {TABS.map((t,i)=><button key={t} style={S.tab(tab===i)} onClick={()=>setTab(i)}>{TAB_ICON[t]} {t}</button>)}
        </div>
      </div>
      <div style={S.body}>
        {error && <div style={{background:"#450a0a",border:"1px solid #f87171",borderRadius:8,padding:"10px 12px",
          marginBottom:12,fontSize:13,color:"#fca5a5"}}>{error}
          <button onClick={load} style={{background:"none",border:"none",color:"#38bdf8",cursor:"pointer",marginLeft:8}}>Retry</button>
        </div>}
        {loading ? <Spinner/> : (<>
          {tab===0 && <LogWorkout people={data.people} exercises={data.exercises} templates={data.templates} onSave={saveWorkout}/>}
          {tab===1 && <History logs={data.workouts} onDelete={deleteWorkout}/>}
          {tab===2 && <Progress logs={data.workouts} people={data.people} exercises={data.exercises}/>}
          {tab===3 && <Records logs={data.workouts} people={data.people} exercises={data.exercises}/>}
          {tab===4 && <Templates templates={data.templates} setTemplates={saveTemplates} exercises={data.exercises}/>}
          {tab===5 && <AIWorkout apiKey={apiKey} setApiKey={setApiKey} aiWorkouts={data.aiWorkouts} onSaveWorkout={saveAiWorkout} onDeleteWorkout={deleteAiWorkout}/>}
          {tab===6 && <Settings people={data.people} setPeople={savePeople} exercises={data.exercises} setExercises={saveExercises}
            onExport={handleExport} onImportFile={handleImportFile} onClearAll={handleClearAll}/>}
        </>)}
      </div>
      <StatusBar/>
      {importPending && (
        <Modal title="Import Backup" onClose={()=>setImportPending(null)}>
          <p style={{color:"#94a3b8",fontSize:13,marginBottom:16,lineHeight:1.6}}>
            This file has {(importPending.workouts||[]).length} workout(s), {(importPending.templates||[]).length} template(s) and {(importPending.aiWorkouts||[]).length} AI workout(s).
            Merge it with your current data, or replace everything currently stored on this device?
          </p>
          <button style={{...S.btnPrimary,marginBottom:10}} onClick={()=>runImport("merge")}>🔀 Merge with existing data</button>
          <button style={{...S.btnDanger,width:"100%",padding:"12px",marginBottom:10,border:"1px solid #f87171"}} onClick={()=>runImport("replace")}>♻️ Replace all data</button>
          <button style={{...S.btnGhost,width:"100%"}} onClick={()=>setImportPending(null)}>Cancel</button>
        </Modal>
      )}
    </div>
  );
}

// ── Log Workout ───────────────────────────────────────────────────────────────
function LogWorkout({people, exercises, templates, onSave}) {
  const [date, setDate]         = useState(todayStr());
  const [activePeople, setActivePeople] = useState([people[0]||""]);
  const [setsMap, setSetsMap]   = useState({[people[0]||""]: [emptySet(exercises)]});
  const [activeTab, setActiveTab] = useState(people[0]||"");
  const [saving, setSaving]     = useState(false);
  const [done, setDone]         = useState(false);
  const [tplModal, setTplModal] = useState(false);
  const [addPersonModal, setAddPersonModal] = useState(false);

  useEffect(()=>{
    if(people.length && !activePeople.some(p=>people.includes(p))) {
      setActivePeople([people[0]]); setSetsMap({[people[0]]:[emptySet(exercises)]}); setActiveTab(people[0]);
    }
  },[people]);

  const addPersonToSession = (p) => {
    if(activePeople.includes(p)) return;
    const np = [...activePeople,p];
    setActivePeople(np); setSetsMap(m=>({...m,[p]:[emptySet(exercises)]})); setActiveTab(p); setAddPersonModal(false);
  };
  const removePersonFromSession = (p) => {
    if(activePeople.length===1) return;
    const np = activePeople.filter(x=>x!==p);
    setActivePeople(np); setSetsMap(m=>{const n={...m};delete n[p];return n;});
    if(activeTab===p) setActiveTab(np[0]);
  };
  const addSet    = () => setSetsMap(m=>({...m,[activeTab]:[...m[activeTab],emptySet(exercises)]}));
  const removeSet = (id) => setSetsMap(m=>({...m,[activeTab]:m[activeTab].filter(s=>s.id!==id)}));
  const updSet    = (id,f,v) => setSetsMap(m=>({...m,[activeTab]:m[activeTab].map(s=>s.id===id?{...s,[f]:v}:s)}));
  const loadTpl   = (t) => { setSetsMap(m=>({...m,[activeTab]:t.sets.map(s=>({...s,id:genId()}))})); setTplModal(false); };

  const save = async () => {
    if(!date||!activePeople.length) return;
    setSaving(true);
    await Promise.all(activePeople.map(p=>{
      const sets=(setsMap[p]||[]).map(({id,...s})=>s).filter(s=>s.exercise);
      if(!sets.length) return Promise.resolve();
      return onSave({id:genId(),date,person:p,sets});
    }));
    setSaving(false); setDone(true);
    setTimeout(()=>{
      setDone(false);
      const first=activePeople[0];
      setActivePeople([first]); setSetsMap({[first]:[emptySet(exercises)]}); setActiveTab(first);
    },1500);
  };

  const currentSets = setsMap[activeTab]||[];
  const availableToAdd = people.filter(p=>!activePeople.includes(p));

  return (
    <div>
      <div style={{marginBottom:12}}>
        <Label>Date</Label>
        <Inp type="date" value={date} onChange={e=>setDate(e.target.value)}/>
      </div>

// ── History ───────────────────────────────────────────────────────────────────
function History({logs, onDelete}) {
  const [expanded, setExpanded] = useState(null);
  const sorted = [...logs].sort((a,b)=>b.date.localeCompare(a.date));
  const del = async (id) => { if(confirm("Delete this workout?")) await onDelete(id); };
  if(!logs.length) return <div style={S.empty}>No workouts logged yet.</div>;
  return (
    <div>
      {sorted.map(log=>(
        <div key={log.id} style={{...S.card,padding:0,overflow:"hidden"}}>
          <div onClick={()=>setExpanded(expanded===log.id?null:log.id)}
            style={{padding:"12px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
            <div><span style={{fontWeight:700,color:"#38bdf8"}}>{log.date}</span><span style={{color:"#94a3b8",marginLeft:8}}>{log.person}</span></div>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <span style={{color:"#64748b",fontSize:12}}>{log.sets.length} sets</span>
              <span style={{color:"#64748b",fontSize:12}}>{expanded===log.id?"▲":"▼"}</span>
            </div>
          </div>
          {expanded===log.id&&(
            <div style={{padding:"0 12px 12px"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{color:"#64748b"}}>
                  <th style={{textAlign:"left",paddingBottom:6}}>Exercise</th>
                  <th style={{textAlign:"right"}}>Weight</th>
                  <th style={{textAlign:"right"}}>Reps</th>
                </tr></thead>
                <tbody>{log.sets.map((s,i)=>(
                  <tr key={i} style={{borderTop:"1px solid #334155"}}>
                    <td style={{padding:"5px 0"}}>{s.exercise}</td>
                    <td style={{textAlign:"right"}}>{s.weight} lbs</td>
                    <td style={{textAlign:"right"}}>{s.reps}</td>
                  </tr>
                ))}</tbody>
              </table>
              <button style={{...S.btnDanger,marginTop:10}} onClick={()=>del(log.id)}>Delete</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ── Progress ──────────────────────────────────────────────────────────────────
function Progress({logs, people, exercises}) {
  const [person, setPerson]     = useState(people[0]||"");
  const [exercise, setExercise] = useState(exercises[0]||"");
  const data = logs.filter(l=>l.person===person)
    .flatMap(l=>l.sets.filter(s=>s.exercise===exercise).map(s=>({date:l.date,weight:+s.weight,reps:+s.reps})))
    .sort((a,b)=>a.date.localeCompare(b.date));
  const maxW=data.length?Math.max(...data.map(d=>d.weight)):0;
  const W=Math.max(data.length*50,200),H=120;
  return (
    <div>
      <div style={{...S.row,marginBottom:16}}>
        <Sel style={{flex:1}} value={person} onChange={e=>setPerson(e.target.value)}>{people.map(p=><option key={p}>{p}</option>)}</Sel>
        <Sel style={{flex:1}} value={exercise} onChange={e=>setExercise(e.target.value)}>{exercises.map(ex=><option key={ex}>{ex}</option>)}</Sel>
      </div>
      {!data.length?<div style={S.empty}>No data for this selection.</div>:(<>
        <div style={{...S.card,overflowX:"auto"}}>
          <div style={{fontSize:12,color:"#64748b",marginBottom:8}}>Weight over time (lbs)</div>
          <svg viewBox={`0 0 ${W} ${H+24}`} style={{width:"100%",minWidth:200}}>
            {data.map((d,i)=>{
              const x=i*50+25,y=maxW?H-(d.weight/maxW)*(H-14)+6:H/2;
              return(<g key={i}>
                {i>0&&(()=>{const px=(i-1)*50+25,py=maxW?H-(data[i-1].weight/maxW)*(H-14)+6:H/2;
                  return<line x1={px} y1={py} x2={x} y2={y} stroke="#0ea5e9" strokeWidth="2"/>;})()}
                <circle cx={x} cy={y} r={5} fill="#0ea5e9"/>
                <text x={x} y={y-9} textAnchor="middle" fill="#e2e8f0" fontSize="11">{d.weight}</text>
                <text x={x} y={H+18} textAnchor="middle" fill="#64748b" fontSize="9">{d.date.slice(5)}</text>
              </g>);
            })}
          </svg>
        </div>
        <div style={S.card}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{color:"#64748b"}}>
              <th style={{textAlign:"left",paddingBottom:6}}>Date</th><th style={{textAlign:"right"}}>Weight</th>
              <th style={{textAlign:"right"}}>Reps</th><th style={{textAlign:"right"}}>Δ</th>
            </tr></thead>
            <tbody>{data.map((d,i)=>{const diff=i>0?d.weight-data[i-1].weight:null;return(
              <tr key={i} style={{borderTop:"1px solid #334155"}}>
                <td style={{padding:"5px 0"}}>{d.date}</td><td style={{textAlign:"right"}}>{d.weight} lbs</td>
                <td style={{textAlign:"right"}}>{d.reps}</td>
                <td style={{textAlign:"right",color:diff>0?"#4ade80":diff<0?"#f87171":"#94a3b8"}}>{diff===null?"—":diff>0?`+${diff}`:diff}</td>
              </tr>);})}</tbody>
          </table>
        </div>
      </>)}
    </div>
  );
}

// ── Records ───────────────────────────────────────────────────────────────────
function Records({logs, people, exercises}) {
  const [person, setPerson] = useState(people[0]||"");
  const recs={};
  exercises.forEach(ex=>{recs[ex]={weight:0,reps:0,date:""};});
  logs.filter(l=>l.person===person).forEach(l=>{
    l.sets.forEach(s=>{
      if(!recs[s.exercise]) recs[s.exercise]={weight:0,reps:0,date:""};
      if(+s.weight>recs[s.exercise].weight) recs[s.exercise]={weight:+s.weight,reps:+s.reps,date:l.date};
    });
  });
  const hasData=Object.values(recs).some(r=>r.weight>0);
  return (
    <div>
      <Sel style={{marginBottom:12}} value={person} onChange={e=>setPerson(e.target.value)}>{people.map(p=><option key={p}>{p}</option>)}</Sel>
      {!hasData?<div style={S.empty}>No records for {person} yet.</div>:(
        <div style={{background:"#1e293b",borderRadius:8,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#334155",color:"#94a3b8"}}>
              <th style={{padding:"9px 12px",textAlign:"left"}}>Exercise</th>
              <th style={{textAlign:"right",padding:"9px 8px"}}>Max</th>
              <th style={{textAlign:"right",padding:"9px 12px"}}>Reps</th>
            </tr></thead>
            <tbody>{Object.entries(recs).filter(([,v])=>v.weight>0).map(([ex,v])=>(
              <tr key={ex} style={{borderTop:"1px solid #334155"}}>
                <td style={{padding:"8px 12px"}}><div>{ex}</div><div style={{fontSize:11,color:"#64748b"}}>{v.date}</div></td>
                <td style={{textAlign:"right",padding:"8px",color:"#fbbf24",fontWeight:700}}>{v.weight} lbs</td>
                <td style={{textAlign:"right",padding:"8px 12px"}}>{v.reps}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── Templates ─────────────────────────────────────────────────────────────────
function Templates({templates, setTemplates, exercises}) {
  const [show,setShow]=useState(false);const [editing,setEditing]=useState(null);
  const [name,setName]=useState("");const [sets,setSets]=useState([emptySet(exercises)]);
  const startNew=()=>{setName("");setSets([emptySet(exercises)]);setEditing(null);setShow(true);};
  const startEdit=(t)=>{setName(t.name);setSets(t.sets.map(s=>({...s,id:genId()})));setEditing(t.id);setShow(true);};
  const addSet=()=>setSets(s=>[...s,emptySet(exercises)]);
  const removeSet=(id)=>setSets(s=>s.filter(x=>x.id!==id));
  const updSet=(id,f,v)=>setSets(s=>s.map(x=>x.id===id?{...x,[f]:v}:x));
  const save=()=>{if(!name.trim())return;const entry={id:editing||genId(),name,sets:sets.map(({id,...s})=>s)};setTemplates(editing?templates.map(t=>t.id===editing?entry:t):[...templates,entry]);setShow(false);};
  const del=(id)=>{if(confirm("Delete template?"))setTemplates(templates.filter(t=>t.id!==id));};
  if(show) return(
    <div>
      <button style={S.btnGhost} onClick={()=>setShow(false)}>← Back</button>
      <h3 style={{margin:"14px 0 10px",color:"#cbd5e1"}}>{editing?"Edit":"New"} Template</h3>
      <Inp value={name} onChange={e=>setName(e.target.value)} placeholder="Template name" style={{marginBottom:12}}/>
      {sets.map((s,i)=>(
        <div key={s.id} style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:12,color:"#64748b"}}>Set {i+1}</span>
            <button onClick={()=>removeSet(s.id)} style={{background:"none",border:"none",color:"#f87171",fontSize:18,cursor:"pointer",lineHeight:1}}>×</button>
          </div>
          <Sel value={s.exercise} onChange={e=>updSet(s.id,"exercise",e.target.value)} style={{marginBottom:8}}>{exercises.map(ex=><option key={ex}>{ex}</option>)}</Sel>
          <div style={S.row}>
            <div style={{flex:1}}><Label>Weight</Label><Inp type="number" inputMode="decimal" value={s.weight} onChange={e=>updSet(s.id,"weight",e.target.value)} placeholder="0"/></div>
            <div style={{flex:1}}><Label>Reps</Label><Inp type="number" inputMode="numeric" value={s.reps} onChange={e=>updSet(s.id,"reps",e.target.value)} placeholder="0"/></div>
          </div>
        </div>
      ))}
      <button style={{...S.btnGhost,width:"100%",padding:"10px",marginBottom:12}} onClick={addSet}>+ Add Set</button>
      <button style={S.btnPrimary} onClick={save}>Save Template</button>
    </div>
  );
  return(
    <div>
      <button style={{...S.btnPrimary,marginBottom:16}} onClick={startNew}>+ New Template</button>
      {templates.length===0&&<div style={S.empty}>No templates yet.</div>}
      {templates.map(t=>(
        <div key={t.id} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:700}}>{t.name}</div><div style={{fontSize:12,color:"#94a3b8"}}>{t.sets.length} sets · {[...new Set(t.sets.map(s=>s.exercise))].slice(0,3).join(", ")}</div></div>
          <div style={{display:"flex",gap:8}}>
            <button style={S.btnGhost} onClick={()=>startEdit(t)}>Edit</button>
            <button style={S.btnDanger} onClick={()=>del(t.id)}>Del</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── AI Workout Generator ──────────────────────────────────────────────────────
function AIWorkout({apiKey, setApiKey, aiWorkouts, onSaveWorkout, onDeleteWorkout}) {
  const [view, setView] = useState("generate"); // generate | history
  const [showApiSetup, setShowApiSetup] = useState(!apiKey);
  const [tempApiKey, setTempApiKey] = useState("");
  const [step, setStep] = useState("form"); // form, loading, result
  const [workout, setWorkout] = useState(null);
  const [viewingId, setViewingId] = useState(null);
  const [error, setError] = useState("");
  const [preferences, setPreferences] = useState({
    fitnessLevel: "Intermediate",
    timeAvailable: "30",
    goal: "Strength",
    equipment: "Dumbbells",
    focusArea: "Full body",
    notes: "",
  });

  const handleSaveApiKey = () => {
    if (!tempApiKey.trim()) return;
    sessionStorage.setItem("claudeApiKey", tempApiKey);
    setApiKey(tempApiKey);
    setShowApiSetup(false);
  };

  const handleGenerate = async () => {
    if (!apiKey) { setShowApiSetup(true); return; }
    try {
      setStep("loading"); setError("");
      const result = await generateWorkoutWithClaude(apiKey, preferences);
      setWorkout(result); setViewingId(null); setStep("result");
    } catch (err) {
      setError(err.message); setStep("form");
    }
  };

  const handleSaveWorkout = async () => {
    if (!workout) return;
    const entry = {id:genId(), date:todayStr(), title: workout.title || "AI Generated Workout", workout};
    await onSaveWorkout(entry);
    setWorkout(null); setStep("form");
    alert("Workout saved!");
  };

  const openHistoryItem = (entry) => { setWorkout(entry.workout); setViewingId(entry.id); setStep("result"); };
  const handleDeleteViewed = async () => {
    if (!viewingId) return;
    if (!confirm("Delete this saved workout?")) return;
    await onDeleteWorkout(viewingId);
    setWorkout(null); setViewingId(null); setStep("form"); setView("history");
  };

  if (showApiSetup) {
    return (
      <div>
        <div style={{...S.card, background:"#2d3b52",padding:14}}>
          <h3 style={{color:"#38bdf8",marginBottom:12}}>🔑 Set Up Claude API Key</h3>
          <p style={{fontSize:12,color:"#cbd5e1",marginBottom:12}}>
            Get your free Anthropic API key at <strong>console.anthropic.com</strong>. You'll get free credits to start.
          </p>
          <Inp
            type="password"
            placeholder="sk-ant-..."
            value={tempApiKey}
            onChange={(e) => setTempApiKey(e.target.value)}
            style={{marginBottom:12}}
          />
          <div style={{display:"flex",gap:10}}>
            <button style={{...S.btnPrimary,flex:1}} onClick={handleSaveApiKey}>Save Key</button>
            {apiKey && <button style={{...S.btnGhost,flex:1}} onClick={() => setShowApiSetup(false)}>Cancel</button>}
          </div>
          <div style={{fontSize:11,color:"#64748b",marginTop:12}}>
            Your API key is kept in this browser tab's session only — it is never written to IndexedDB or included in exports.
          </div>
        </div>
      </div>
    );
  }

  if (step === "result" && workout) {
    return (
      <div>
        <button style={S.btnGhost} onClick={() => { setWorkout(null); setViewingId(null); setStep("form"); }}>← Back</button>
        <div style={{...S.cardAI,marginTop:12,cursor:"default"}}>
          <h2 style={{color:"#38bdf8",marginBottom:12}}>{workout.title}</h2>

          <div style={{marginBottom:16}}>
            <h3 style={{color:"#cbd5e1",fontSize:14,fontWeight:700,marginBottom:8}}>🔥 Warm-Up</h3>
            {workout.warmup?.map((ex, i) => (
              <div key={i} style={{background:"#0f172a",padding:10,borderRadius:6,marginBottom:8}}>
                <div style={{fontWeight:700,color:"#fbbf24"}}>{ex.name}</div>
                <div style={{fontSize:12,color:"#94a3b8"}}>{ex.duration}</div>
                <div style={{fontSize:12,color:"#cbd5e1",marginTop:4}}>{ex.description}</div>
                {ex.videoQuery && <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(ex.videoQuery)}`} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#38bdf8",marginTop:4,display:"block"}}>🎥 Find video</a>}
              </div>
            ))}
          </div>

          <div style={{marginBottom:16}}>
            <h3 style={{color:"#cbd5e1",fontSize:14,fontWeight:700,marginBottom:8}}>💪 Main Workout</h3>
            {workout.main?.map((ex, i) => (
              <div key={i} style={{background:"#0f172a",padding:10,borderRadius:6,marginBottom:8}}>
                <div style={{fontWeight:700,color:"#fbbf24"}}>{ex.name}</div>
                <div style={{fontSize:12,color:"#94a3b8"}}>{ex.sets} × {ex.reps}</div>
                <div style={{fontSize:12,color:"#cbd5e1",marginTop:4}}>{ex.description}</div>
                {ex.videoQuery && <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(ex.videoQuery)}`} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#38bdf8",marginTop:4,display:"block"}}>🎥 Find video</a>}
              </div>
            ))}
          </div>

          <div style={{marginBottom:16}}>
            <h3 style={{color:"#cbd5e1",fontSize:14,fontWeight:700,marginBottom:8}}>🧘 Cool-Down</h3>
            {workout.cooldown?.map((ex, i) => (
              <div key={i} style={{background:"#0f172a",padding:10,borderRadius:6,marginBottom:8}}>
                <div style={{fontWeight:700,color:"#fbbf24"}}>{ex.name}</div>
                <div style={{fontSize:12,color:"#94a3b8"}}>{ex.duration}</div>
                <div style={{fontSize:12,color:"#cbd5e1",marginTop:4}}>{ex.description}</div>
              </div>
            ))}
          </div>

          {workout.notes && (
            <div style={{background:"#0f172a",padding:10,borderRadius:6,borderLeft:"3px solid #fbbf24"}}>
              <div style={{fontSize:12,color:"#cbd5e1"}}><strong>⚠️ Notes:</strong> {workout.notes}</div>
            </div>
          )}

          <div style={{display:"flex",gap:10,marginTop:16}}>
            {viewingId ? (
              <button style={{...S.btnDanger,flex:1,border:"1px solid #f87171",textAlign:"center"}} onClick={handleDeleteViewed}>🗑️ Delete</button>
            ) : (<>
              <button style={{...S.btnPrimary,flex:1}} onClick={handleSaveWorkout}>💾 Save Workout</button>
              <button style={{...S.btnGhost,flex:1}} onClick={() => { setWorkout(null); setStep("form"); }}>Generate New</button>
            </>)}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button style={S.toggle(view==="generate")} onClick={()=>setView("generate")}>Generate</button>
        <button style={S.toggle(view==="history")} onClick={()=>setView("history")}>History ({aiWorkouts.length})</button>
      </div>

      {view === "history" ? (
        aiWorkouts.length===0 ? <div style={S.empty}>No AI workouts generated yet.</div> : (
          <div>
            {[...aiWorkouts].sort((a,b)=>b.date.localeCompare(a.date)).map(w => (
              <div key={w.id} style={S.cardAI} onClick={()=>openHistoryItem(w)}>
                <div style={{fontWeight:700,color:"#8b5cf6"}}>{w.title}</div>
                <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{w.date}</div>
              </div>
            ))}
          </div>
        )
      ) : (
        <div>
          <div style={{...S.cardAI,cursor:"default"}}>
            <h3 style={{color:"#8b5cf6",marginBottom:12}}>🤖 AI Workout Generator</h3>

            <Label>Fitness Level</Label>
            <Sel value={preferences.fitnessLevel} onChange={(e) => setPreferences({...preferences,fitnessLevel:e.target.value})} style={{marginBottom:12}}>
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
            </Sel>

            <Label>Time Available (minutes)</Label>
            <Sel value={preferences.timeAvailable} onChange={(e) => setPreferences({...preferences,timeAvailable:e.target.value})} style={{marginBottom:12}}>
              <option>10</option>
              <option>15</option>
              <option>20</option>
              <option>30</option>
              <option>45</option>
              <option>60</option>
            </Sel>

            <Label>Goal</Label>
            <Sel value={preferences.goal} onChange={(e) => setPreferences({...preferences,goal:e.target.value})} style={{marginBottom:12}}>
              <option>Strength</option>
              <option>Hypertrophy</option>
              <option>Cardio</option>
              <option>Endurance</option>
              <option>Flexibility</option>
              <option>Weight Loss</option>
              <option>General Fitness</option>
            </Sel>

            <Label>Equipment</Label>
            <Sel value={preferences.equipment} onChange={(e) => setPreferences({...preferences,equipment:e.target.value})} style={{marginBottom:12}}>
              <option>Bodyweight only</option>
              <option>Dumbbells</option>
              <option>Barbell</option>
              <option>Resistance bands</option>
              <option>Full gym</option>
            </Sel>

            <Label>Focus Area</Label>
            <Sel value={preferences.focusArea} onChange={(e) => setPreferences({...preferences,focusArea:e.target.value})} style={{marginBottom:12}}>
              <option>Full body</option>
              <option>Upper body</option>
              <option>Lower body</option>
              <option>Core</option>
              <option>Chest</option>
              <option>Back</option>
              <option>Shoulders</option>
              <option>Arms</option>
              <option>Legs</option>
            </Sel>

            <Label>Special Notes (injuries, preferences)</Label>
            <Inp
              value={preferences.notes}
              onChange={(e) => setPreferences({...preferences,notes:e.target.value})}
              placeholder="E.g., Lower back pain, avoid squats"
              style={{marginBottom:12}}
            />

            {error && <div style={{background:"#7f1d1d",color:"#fecaca",padding:10,borderRadius:6,marginBottom:12,fontSize:12}}>{error}</div>}

            <button
              style={S.btnPrimary}
              onClick={handleGenerate}
              disabled={step === "loading"}
            >
              {step === "loading" ? "⏳ Generating..." : "🚀 Generate Workout"}
            </button>

            <button
              style={{...S.btnGhost,width:"100%",marginTop:8}}
              onClick={() => setShowApiSetup(true)}
            >
              🔑 Update API Key
            </button>
          </div>

          <div style={{fontSize:12,color:"#64748b",marginTop:16,padding:12,background:"#1e293b",borderRadius:6}}>
            <strong>How it works:</strong> Tell Claude your preferences and it generates a customized workout with exercise descriptions and YouTube video links. Saved workouts land in the History tab above and are stored on this device.
          </div>
        </div>
      )}
    </div>
  );
}

// ── Settings ──────────────────────────────────────────────────────────────────
function Settings({people,setPeople,exercises,setExercises,onExport,onImportFile,onClearAll}) {
  const [newPerson,setNewPerson]=useState("");
  const [newEx,setNewEx]=useState("");
  const fileInputRef = useRef(null);
  const addPerson=()=>{if(newPerson.trim()&&!people.includes(newPerson)){setPeople([...people,newPerson]);setNewPerson("");}};
  const addEx=()=>{if(newEx.trim()&&!exercises.includes(newEx)){setExercises([...exercises,newEx]);setNewEx("");}};
  return(
    <div>
      {/* Data */}
      <div style={{marginBottom:20}}>
        <h3 style={S.sectionTitle}>💾 Data</h3>
        <div style={S.card}>
          <div style={{fontSize:12,color:"#94a3b8",marginBottom:12,lineHeight:1.6}}>
            All data is stored locally on this device using IndexedDB — it survives browser restarts but not clearing site data. Export a backup regularly, or move data between devices with export/import.
          </div>
          <button style={{...S.btnPrimary,marginBottom:10}} onClick={onExport}>📥 Export Workouts</button>
          <button style={{...S.btnGhost,width:"100%",padding:"10px",textAlign:"center"}} onClick={()=>fileInputRef.current?.click()}>📤 Import Workouts</button>
          <input ref={fileInputRef} type="file" accept="application/json,.json" style={{display:"none"}}
            onChange={e=>{ const f=e.target.files[0]; if(f) onImportFile(f); e.target.value=""; }}/>
        </div>
        <button style={{...S.btnDanger,width:"100%",padding:"10px",marginTop:10,border:"1px solid #334155",textAlign:"center"}} onClick={onClearAll}>🗑️ Clear All Data</button>
      </div>
      {/* People */}
      <div style={{marginBottom:20}}>
        <h3 style={S.sectionTitle}>People</h3>
        <div style={{...S.row,marginBottom:10}}>
          <Inp value={newPerson} onChange={e=>setNewPerson(e.target.value)} placeholder="Add person" onKeyDown={e=>e.key==="Enter"&&addPerson()}/>
          <button style={{...S.btnPrimary,width:"auto",padding:"0 16px"}} onClick={addPerson}>Add</button>
        </div>
        {people.map(p=>(
          <div key={p} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span>{p}</span>
            <button style={{background:"none",border:"none",color:"#f87171",cursor:"pointer"}} onClick={()=>setPeople(people.filter(x=>x!==p))}>Remove</button>
          </div>
        ))}
      </div>
      {/* Exercises */}
      <div style={{marginBottom:20}}>
        <h3 style={S.sectionTitle}>Exercises</h3>
        <div style={{...S.row,marginBottom:10}}>
          <Inp value={newEx} onChange={e=>setNewEx(e.target.value)} placeholder="Add exercise" onKeyDown={e=>e.key==="Enter"&&addEx()}/>
          <button style={{...S.btnPrimary,width:"auto",padding:"0 16px"}} onClick={addEx}>Add</button>
        </div>
        {exercises.map(ex=>(
          <div key={ex} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span>{ex}</span>
            <button style={{background:"none",border:"none",color:"#f87171",cursor:"pointer"}} onClick={()=>setExercises(exercises.filter(x=>x!==ex))}>Remove</button>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
