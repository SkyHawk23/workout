<html lang="en">

<style>
:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #0088b0;
  --color-accent-2: #d6006c;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #e9f8ff;
  --color-accent-200: #cbeeff;
  --color-accent-300: #99e0ff;
  --color-accent-400: #62c5ee;
  --color-accent-500: #38a6cf;
  --color-accent-600: #1186ac;
  --color-accent-700: #006786;
  --color-accent-800: #004961;
  --color-accent-900: #0a303e;

  --color-accent-2-100: #fff1f4;
  --color-accent-2-200: #ffdee6;
  --color-accent-2-300: #ffc0d0;
  --color-accent-2-400: #ff90b1;
  --color-accent-2-500: #ff458e;
  --color-accent-2-600: #d82071;
  --color-accent-2-700: #aa0b56;
  --color-accent-2-800: #790e3d;
  --color-accent-2-900: #4b1528;

  --font-heading: "Source Serif 4", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Source Serif 4", system-ui, sans-serif;

  --space-1: 5px; --space-2: 10px; --space-3: 15px; --space-4: 20px; --space-6: 30px; --space-8: 40px;
  --radius-sm: 1px; --radius-md: 2px; --radius-lg: 4px;
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--color-neutral-300); }
body { color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input, select { font-family: inherit; }
a { color: var(--color-accent-700); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--color-neutral-200); }
::-webkit-scrollbar-thumb { background: var(--color-neutral-500); border-radius: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover:not(:disabled) { background: var(--color-accent-600); }
.btn-primary:active:not(:disabled) { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active:not(:disabled) { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent-700); padding-inline: var(--space-1); }
.btn-ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }

.field > label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
.input {
  width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 15px;
  color: var(--color-text); caret-color: var(--color-accent); background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }

.seg { display: flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
.seg-opt {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  flex: 1; min-height: 44px; padding: 0 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }
.seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }

.dialog-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--space-4); background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent); z-index: 100; }
.dialog { width: min(340px, 100%); display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-lg); }
.dialog-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; }
.dialog-body { font-size: 14px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

.tabular { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;

/* ── Constants ──────────────────────────────────────────────────────────── */
const NAV = [
  {k: "home", l: "Today"}, {k: "history", l: "History"}, {k: "progress", l: "Progress"},
  {k: "coach", l: "Coach"}, {k: "settings", l: "Settings"},
];
const genId = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const oldDate = (daysAgo) => new Date(Date.now() - daysAgo * 86400000).toISOString().slice(0, 10);

const SEED_ROUTINES = [
  {id: "r1", name: "Push Day", note: "Chest, shoulders, triceps", last: "2026-08-22", ex: [
    {name: "Bench Press", sets: 3, reps: 8, weight: 135, cue: "Elbows tucked, drive through the floor."},
    {name: "Overhead Press", sets: 3, reps: 10, weight: 65, cue: "Ribs down, press to a locked overhead."},
    {name: "Incline Dumbbell Press", sets: 3, reps: 10, weight: 40, cue: "Slow on the way down."},
    {name: "Triceps Pushdown", sets: 3, reps: 12, weight: 50, cue: "Keep the elbows pinned."},
  ]},
  {id: "r2", name: "Pull Day", note: "Back and biceps", last: "2026-08-20", ex: [
    {name: "Deadlift", sets: 3, reps: 5, weight: 225, cue: "Neutral spine, bar close to the shins."},
    {name: "Barbell Row", sets: 3, reps: 8, weight: 115, cue: "Pull to the belly, no heaving."},
    {name: "Pull-up", sets: 3, reps: 8, weight: 0, cue: "Full hang at the bottom."},
    {name: "Face Pull", sets: 3, reps: 15, weight: 30, cue: "High elbows, pull to the eyes."},
  ]},
  {id: "r3", name: "Leg Day", note: "Quads, hamstrings, calves", last: "2026-08-18", ex: [
    {name: "Squat", sets: 4, reps: 6, weight: 185, cue: "Knees track over the toes."},
    {name: "Romanian Deadlift", sets: 3, reps: 8, weight: 135, cue: "Hinge at the hips, soft knees."},
    {name: "Leg Press", sets: 3, reps: 12, weight: 230, cue: "Stop short of locking out."},
    {name: "Calf Raise", sets: 3, reps: 15, weight: 90, cue: "Pause at the top."},
  ]},
  {id: "r4", name: "Express Full Body", note: "Twenty minutes, no kit", last: "2026-08-15", ex: [
    {name: "Goblet Squat", sets: 3, reps: 12, weight: 35, cue: "Chest tall, elbows inside the knees."},
    {name: "Push-up", sets: 3, reps: 15, weight: 0, cue: "One straight line, head to heels."},
    {name: "Dumbbell Row", sets: 3, reps: 12, weight: 45, cue: "One side at a time."},
  ]},
];
const SEED_HISTORY = [
  {id: "h1", date: "2026-08-22", name: "Push Day", sets: 12, mins: 41},
  {id: "h2", date: "2026-08-20", name: "Pull Day", sets: 12, mins: 46},
  {id: "h3", date: "2026-08-18", name: "Leg Day", sets: 13, mins: 52},
  {id: "h4", date: "2026-08-15", name: "Express Full Body", sets: 9, mins: 22},
  {id: "h5", date: "2026-08-13", name: "Push Day", sets: 12, mins: 39},
  {id: "h6", date: "2026-08-11", name: "Pull Day", sets: 11, mins: 44},
  {id: "h7", date: "2026-08-06", name: "Leg Day", sets: 13, mins: 50},
  {id: "h8", date: "2026-07-30", name: "Push Day", sets: 12, mins: 43},
];
const DEFAULT_PREFS = {view: "exercise", rest: "manual", secs: 90};

/* ── IndexedDB ──────────────────────────────────────────────────────────── */
const DB_NAME = "WorkoutTrackerDB";
const DB_VERSION = 2;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      // legacy v1 stores (kept only as a migration source)
      if (!db.objectStoreNames.contains("workouts")) db.createObjectStore("workouts", {keyPath: "id"});
      if (!db.objectStoreNames.contains("templates")) db.createObjectStore("templates", {keyPath: "id"});
      if (!db.objectStoreNames.contains("aiWorkouts")) db.createObjectStore("aiWorkouts", {keyPath: "id"});
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      // v2 — Daily Lift schema
      if (!db.objectStoreNames.contains("routines")) db.createObjectStore("routines", {keyPath: "id"});
      if (!db.objectStoreNames.contains("history")) db.createObjectStore("history", {keyPath: "id"});
      if (!db.objectStoreNames.contains("prefs")) db.createObjectStore("prefs");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetAll(store) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(store, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(store, value, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    if (key !== undefined) tx.objectStore(store).put(value, key); else tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbReplaceAll(store, values) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    const os = tx.objectStore(store);
    os.clear();
    values.forEach(v => os.put(v));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ── Migration from the old Google-Sheets-era schema ───────────────────── */
function templateToRoutine(t) {
  const byName = new Map();
  (t.sets || []).forEach(s => {
    const key = s.exercise || "Exercise";
    if (!byName.has(key)) byName.set(key, {name: key, sets: 0, reps: Number(s.reps) || 1, weight: Number(s.weight) || 0, cue: ""});
    byName.get(key).sets += 1;
  });
  const ex = [...byName.values()];
  return {id: t.id || genId(), name: t.name || "Migrated routine", note: "Migrated template", last: oldDate(30),
    ex: ex.length ? ex : [{name: "Exercise", sets: 3, reps: 10, weight: 0, cue: ""}]};
}
function aiWorkoutToRoutine(w) {
  const main = (w.workout && w.workout.main) || [];
  const ex = main.map(m => ({
    name: m.name || "Exercise",
    sets: Math.max(1, parseInt(m.sets, 10) || 3),
    reps: Math.max(1, parseInt(String(m.reps || "").match(/\d+/)?.[0] || "10", 10)),
    weight: 0, cue: m.description || "",
  }));
  return {id: w.id || genId(), name: (w.workout && w.workout.title) || w.title || "AI workout", note: "Migrated AI workout", last: oldDate(30),
    ex: ex.length ? ex : [{name: "Exercise", sets: 3, reps: 10, weight: 0, cue: ""}]};
}
function workoutToHistory(w) {
  const byName = new Map();
  (w.sets || []).forEach(s => {
    const key = s.exercise || "Exercise";
    if (!byName.has(key)) byName.set(key, {name: key, count: 0, weight: Number(s.weight) || 0, reps: Number(s.reps) || 0});
    byName.get(key).count += 1;
  });
  const detail = [...byName.values()].map(e => ({name: e.name, target: `${e.count} × ${e.weight ? e.weight + " lb × " + e.reps : e.reps + " reps"}`}));
  const setsTotal = (w.sets || []).length;
  return {id: w.id || genId(), date: w.date, name: `${w.person || "Workout"}`, sets: setsTotal, mins: Math.max(5, setsTotal * 3), detail};
}

async function loadAppState() {
  let prefs = await idbGet("prefs", "prefs");
  let routines = await idbGetAll("routines");
  let history = await idbGetAll("history");

  if (!prefs) {
    const [legacyWorkouts, legacyTemplates, legacyAi] = await Promise.all([
      idbGetAll("workouts"), idbGetAll("templates"), idbGetAll("aiWorkouts"),
    ]);
    const hasLegacy = legacyWorkouts.length || legacyTemplates.length || legacyAi.length;
    if (hasLegacy) {
      routines = [...legacyTemplates.map(templateToRoutine), ...legacyAi.map(aiWorkoutToRoutine)];
      history = legacyWorkouts.map(workoutToHistory);
    } else if (!routines.length && !history.length) {
      routines = JSON.parse(JSON.stringify(SEED_ROUTINES));
      history = SEED_HISTORY.slice();
    }
    prefs = {...DEFAULT_PREFS};
    await idbReplaceAll("routines", routines);
    await idbReplaceAll("history", history);
    await idbPut("prefs", prefs, "prefs");
  }
  return {routines, history: sortHistory(history), prefs};
}

/* ── Claude AI (Coach) ──────────────────────────────────────────────────── */
async function callClaudeForRoutine(apiKey, {minutes, focus, equipment}) {
  const prompt = `You are a strength coach. Build ONE workout routine as strict JSON (no markdown, no prose) matching exactly this shape:
{"name": "short routine name", "note": "one short line describing the routine", "ex": [{"name": "Exercise name", "sets": <int>, "reps": <int>, "weight": <int, pounds, 0 for bodyweight>, "cue": "one short coaching cue"}]}

Constraints:
- Time available: ${minutes} minutes total — scale exercise count and sets to fit (roughly 3 exercises x 2 sets for 20 min, 4 exercises x 3 sets for 30-45 min, 4-5 exercises x 4 sets for 60 min)
- Focus: ${focus}
- Equipment: ${equipment} — if "Bodyweight only", every exercise must use weight: 0
- Weight values are working weights in pounds, sensible for an intermediate lifter; use 0 for bodyweight moves
- Keep names and cues concise, in the style of a terse workout log, no emoji`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json",
    },
    body: JSON.stringify({model: "claude-sonnet-5", max_tokens: 1000, messages: [{role: "user", content: prompt}]}),
  });
  if (!response.ok) {
    const e = await response.json().catch(() => ({}));
    throw new Error(e.error?.message || "Claude API error");
  }
  const data = await response.json();
  const text = data.content[0].text;
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error("Invalid response format");
  const parsed = JSON.parse(match[0]);
  const ex = (parsed.ex || []).map(e => ({
    name: e.name || "Exercise",
    sets: Math.max(1, parseInt(e.sets, 10) || 3),
    reps: Math.max(1, parseInt(e.reps, 10) || 10),
    weight: Math.max(0, parseInt(e.weight, 10) || 0),
    cue: e.cue || "",
  }));
  if (!ex.length) throw new Error("Claude didn't return any exercises");
  return {
    id: "r" + Date.now(), name: parsed.name || `${focus} · ${minutes} min`,
    note: parsed.note || `${equipment}, built just now`, last: "2000-01-01", ex,
  };
}

/* ── Helpers mirroring the design reference's state machine ───────────── */
function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric"});
}
function agoText(iso) {
  const days = Math.round((Date.now() - new Date(iso + "T12:00:00").getTime()) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 14) return days + " days ago";
  return Math.floor(days / 7) + " weeks ago";
}
function target(e) { return e.weight ? e.weight + " lb × " + e.reps : e.reps + " reps"; }
function targetAt(e, w) { return w ? w + " lb × " + e.reps : e.reps + " reps"; }
function totalSets(r) { return r.ex.reduce((n, e) => n + e.sets, 0); }
function listNames(r) { return r.ex.map(e => e.name).join(" · "); }
function sortHistory(arr) {
  return [...arr].sort((a, b) => b.date.localeCompare(a.date) || ((b.ts || 0) - (a.ts || 0)));
}

/* ── Small UI atoms ─────────────────────────────────────────────────────── */
function Btn({variant = "primary", style, children, ...p}) {
  return <button className={`btn btn-${variant}`} style={style} {...p}>{children}</button>;
}
function Seg({name, value, options, onChange}) {
  return (
    <div className="seg">
      {options.map(o => (
        <label key={o.value} className="seg-opt">
          <input type="radio" name={name} checked={value === o.value} onChange={() => onChange(o.value)}/>
          {o.label}
        </label>
      ))}
    </div>
  );
}
const kicker = (color) => ({fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", color});

/* ── Masthead + tab bar ─────────────────────────────────────────────────── */
function Masthead({sessionsLogged}) {
  const today = new Date().toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric"});
  return (
    <div style={{padding: "26px 20px 0"}}>
      <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 34, letterSpacing: "-0.5px", lineHeight: 1}}>The Daily Lift</div>
      <div style={{height: 4, background: "var(--color-text)", marginTop: 14}}/>
      <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--color-neutral-700)"}}>
        <span>{today}</span>
        <span>{sessionsLogged} sessions logged</span>
      </div>
      <div style={{height: 1, background: "var(--color-text)"}}/>
    </div>
  );
}
function TabBar({screen, onGo}) {
  return (
    <div style={{position: "fixed", bottom: 0, width: "100%", maxWidth: 430, background: "var(--color-bg)", borderTop: "1px solid var(--color-text)"}}>
      <div style={{display: "flex"}}>
        {NAV.map(n => (
          <button key={n.k} onClick={() => onGo(n.k)} style={{flex: 1, minHeight: 56, background: "none", border: "none", cursor: "pointer",
            padding: "8px 2px", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase",
            color: screen === n.k ? "var(--color-accent-700)" : "var(--color-neutral-700)"}}>{n.l}</button>
        ))}
      </div>
    </div>
  );
}

/* ── Screens ────────────────────────────────────────────────────────────── */
function Home({routines, go, begin}) {
  if (!routines.length) {
    return (
      <div style={{padding: "28px 20px 0"}}>
        <div style={{...kicker("var(--color-accent-700)"), marginBottom: 8}}>Up next today</div>
        <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 26, lineHeight: 1.1, letterSpacing: "-0.4px"}}>No workouts yet</div>
        <div style={{fontSize: 15, color: "var(--color-neutral-700)", marginTop: 8, lineHeight: 1.5, textWrap: "pretty"}}>Head to Coach to build your first routine.</div>
        <button className="btn btn-primary" style={{marginTop: "var(--space-4)", minHeight: 52, fontSize: 17, width: "100%"}} onClick={() => go("coach")}>Go to Coach</button>
      </div>
    );
  }
  const sorted = [...routines].sort((a, b) => b.last.localeCompare(a.last));
  const suggestion = [...routines].sort((a, b) => a.last.localeCompare(b.last))[0];
  const pastRows = sorted.filter(x => x.id !== suggestion.id);
  return (
    <div>
      <div style={{padding: "28px 20px 0"}}>

                  <div style={{fontSize: 13, color: "var(--color-neutral-700)", marginTop: 4}}>{agoText(row.last)} · {row.ex.length} exercises · {totalSets(row)} sets</div>

function Run(props) {
  const {routine, exIndex, done, logged, run, prefs, quitRun, sessionClock, sessionPaused, sessionToggle,
    weightUp, weightDown, repsUp, repsDown, primaryAction, skipAction, tick,
    restShown, restOn, restLeft, restAction, restSkip} = props;
  if (!routine) return null;
  const ex = routine.ex[exIndex];
  const doneCount = done[exIndex] || 0;
  const doneTotal = done.reduce((a, b) => a + b, 0);
  const pct = Math.round(doneTotal / totalSets(routine) * 100) + "%";
  const hasWeight = !!(ex && ex.weight);
  const primaryLabel = (doneCount + 1 >= ex.sets)
    ? (exIndex + 1 >= routine.ex.length ? "Finish workout" : "Done — next exercise")
    : `Set ${doneCount + 1} done`;
  const upNext = exIndex + 1 < routine.ex.length ? `Up next: ${routine.ex[exIndex + 1].name}` : "Last exercise of the session.";
  const setLabel = `Set ${Math.min(doneCount + 1, ex.sets)} of ${ex.sets}`;
  const mm = Math.floor(restLeft / 60), ss = String(restLeft % 60).padStart(2, "0");

  return (
    <div style={{padding: "22px 20px 0"}}>
      <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--color-neutral-700)"}}>
        <span>{routine.name}</span>
        <button onClick={quitRun} style={{background: "none", border: "none", color: "var(--color-neutral-700)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", cursor: "pointer", padding: 4}}>End</button>
      </div>
      <div style={{display: "flex", alignItems: "baseline", gap: "var(--space-3)", marginTop: 8}}>
        <div className="tabular" style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 26, lineHeight: 1, flex: 1}}>{sessionClock}</div>
        <Btn variant="ghost" style={{minHeight: 36, padding: "0 12px", fontSize: 13, whiteSpace: "nowrap"}} onClick={sessionToggle}>{sessionPaused ? "Resume" : "Pause"}</Btn>
      </div>
      <div style={{height: 3, background: "var(--color-neutral-300)", marginTop: 10}}>
        <div style={{height: 3, background: "var(--color-accent)", width: pct}}/>
      </div>

      <div style={{marginTop: "var(--space-6)"}}>
        <div style={{fontSize: 13, color: "var(--color-neutral-700)", letterSpacing: "0.06em"}}>Exercise {exIndex + 1} of {routine.ex.length}</div>
        <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 38, lineHeight: 1.05, letterSpacing: "-0.8px", marginTop: 8}}>{ex.name}</div>
        <div style={{fontSize: 15, color: "var(--color-neutral-700)", marginTop: 10, fontStyle: "italic", lineHeight: 1.5, textWrap: "pretty"}}>{ex.cue}</div>
      </div>

      <div style={{marginTop: "var(--space-6)", paddingTop: "var(--space-4)", borderTop: "1px solid var(--color-divider)"}}>
        <div style={kicker("var(--color-accent-700)")}>{setLabel}</div>
        <div className="tabular" style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 40, lineHeight: 1, letterSpacing: "-1px", marginTop: 10}}>{target(ex)}</div>
        <div style={{display: "flex", flexWrap: "wrap", gap: "var(--space-4) var(--space-6)", marginTop: "var(--space-4)"}}>
          {hasWeight && (
            <div>
              <div style={kicker("var(--color-neutral-700)")}>Adjust weight</div>
              <div style={{display: "flex", alignItems: "center", gap: "var(--space-2)", marginTop: 8}}>
                <Btn variant="secondary" aria-label="Lower weight" style={{minHeight: 46, width: 46, padding: 0, fontSize: 20}} onClick={weightDown}>&minus;</Btn>
                <div className="tabular" style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 18, minWidth: 62, textAlign: "center"}}>{ex.weight} lb</div>
                <Btn variant="secondary" aria-label="Raise weight" style={{minHeight: 46, width: 46, padding: 0, fontSize: 20}} onClick={weightUp}>+</Btn>
              </div>
            </div>
          )}
          <div>
            <div style={kicker("var(--color-neutral-700)")}>Adjust reps</div>
            <div style={{display: "flex", alignItems: "center", gap: "var(--space-2)", marginTop: 8}}>
              <Btn variant="secondary" aria-label="Lower reps" style={{minHeight: 46, width: 46, padding: 0, fontSize: 20}} onClick={repsDown}>&minus;</Btn>
              <div className="tabular" style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 18, minWidth: 62, textAlign: "center"}}>{ex.reps} reps</div>
              <Btn variant="secondary" aria-label="Raise reps" style={{minHeight: 46, width: 46, padding: 0, fontSize: 20}} onClick={repsUp}>+</Btn>
            </div>
          </div>
        </div>
      </div>

      <div style={{display: "flex", gap: "var(--space-2)", marginTop: "var(--space-6)"}}>
        <Btn style={{flex: 1, minHeight: 56, fontSize: 17}} onClick={primaryAction}>{primaryLabel}</Btn>
        <Btn variant="ghost" style={{minHeight: 56, padding: "0 18px"}} onClick={skipAction}>Skip</Btn>
      </div>
      <div style={{fontSize: 13, color: "var(--color-neutral-700)", marginTop: "var(--space-3)", lineHeight: 1.5}}>{upNext}</div>

      {prefs.view === "exercise" && (
        <div style={{marginTop: "var(--space-6)"}}>
          {Array.from({length: ex.sets}, (_, i) => {
            const isDone = i < doneCount;
            const t = isDone ? targetAt(ex, logged[exIndex + ":" + i] ?? ex.weight) : target(ex);
            return (
              <div key={i} style={{display: "flex", alignItems: "center", gap: "var(--space-3)", padding: "12px 2px", borderBottom: "1px solid var(--color-divider)", minHeight: 44}}>
                <div style={{flex: 1, fontSize: 13, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--color-neutral-700)"}}>SET {i + 1}</div>
                <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 18}}>{t}</div>
                {isDone ? (
                  <Btn variant="ghost" style={{minHeight: 40, padding: "0 12px", whiteSpace: "nowrap", color: "var(--color-accent-700)"}} onClick={() => tick(i)}>&#10003; Done</Btn>
                ) : (
                  <Btn variant="secondary" style={{minHeight: 40, padding: "0 14px", whiteSpace: "nowrap"}} onClick={() => tick(i)}>Mark done</Btn>
                )}
              </div>
            );
          })}
        </div>
      )}

      {restShown && (
        <div className="dialog-backdrop">
          <div className="dialog" style={{maxWidth: 340}}>
            <div className="dialog-title">Set logged — rest?</div>
            <div className="dialog-body">
              <div className="tabular" style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 52, lineHeight: 1, letterSpacing: "-1px"}}>{mm}:{ss}</div>
              <div style={{fontSize: 14, color: "var(--color-neutral-700)", marginTop: 10, lineHeight: 1.5, textWrap: "pretty"}}>
                {restOn ? "Running — this closes itself when it hits zero." : "Start the clock, or skip straight to the next set."}
              </div>
            </div>
            <div className="dialog-actions">
              <Btn variant="ghost" style={{minHeight: 44, whiteSpace: "nowrap"}} onClick={restSkip}>Skip rest</Btn>
              <Btn style={{minHeight: 44, whiteSpace: "nowrap"}} onClick={restAction}>{restOn ? "Pause" : "Start timer"}</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Done({routine, doneSummary, goHome}) {

      <div style={kicker("var(--color-accent-2-700)")}>Filed</div>

function History({history, openId, setOpenId, removeHistory}) {

    <div style={{padding: "28px 20px 0"}}>
      <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 28, letterSpacing: "-0.4px"}}>History</div>

      {history.map(h => {

        return (
          <div key={h.id} style={{padding: "4px 0", borderBottom: "1px solid var(--color-divider)"}}>
            <div onClick={() => setOpenId(open ? null : h.id)} style={{display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: "var(--space-2)", padding: "14px 0", cursor: "pointer", minHeight: 44}}>
              <div>
                <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 18}}>{h.name}</div>
                <div style={{fontSize: 13, color: "var(--color-neutral-700)", marginTop: 3}}>{h.sets} sets · {h.mins} min</div>
              </div>
              <div style={{display: "flex", alignItems: "baseline", gap: "var(--space-2)", flex: "none"}}>
                <div style={{fontSize: 13, color: "var(--color-neutral-700)", whiteSpace: "nowrap"}}>{fmtDate(h.date)}</div>
                <div style={{fontSize: 12, color: "var(--color-accent-700)", whiteSpace: "nowrap"}}>{open ? "Hide" : "Details"}</div>
              </div>
            </div>
            {open && (
              <div style={{padding: "0 0 var(--space-4)", display: "flex", flexDirection: "column", gap: 8}}>
                {(h.detail || []).map((d, i) => (
                  <div key={i} style={{display: "flex", justifyContent: "space-between", gap: "var(--space-3)", fontSize: 15}}>
                    <div style={{color: "var(--color-neutral-800)"}}>{d.name}</div>
                    <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, whiteSpace: "nowrap"}}>{d.target}</div>
                  </div>
                ))}
                <div style={{fontSize: 13, color: "var(--color-neutral-700)", fontStyle: "italic"}}>
                  {h.detail ? "Logged as you trained." : "Older session — exercise detail wasn't recorded."}
                </div>
                <Btn variant="ghost" style={{alignSelf: "flex-start", minHeight: 36, padding: "0 12px", marginTop: 4}} onClick={() => { if (confirm("Remove this session from your history?")) removeHistory(h.id); }}>Remove</Btn>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Progress({routines, history}) {
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const end = Date.now() - i * 7 * 86400000, start = end - 7 * 86400000;
    const n = history.filter(h => { const t = new Date(h.date + "T12:00:00").getTime(); return t > start && t <= end; }).length;
    weeks.push({label: i === 0 ? "now" : i + "w", count: n, h: (n / 4 * 100) + "%"});
  }
  const bests = {};
  routines.forEach(x => x.ex.forEach(e => { if (!(e.name in bests) || e.weight > bests[e.name]) bests[e.name] = e.weight; }));
  const bestRows = Object.keys(bests).slice(0, 8).map(k => ({name: k, best: bests[k] ? bests[k] + " lb" : "bodyweight"}));

  return (
    <div style={{padding: "28px 20px 0"}}>
      <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 28, letterSpacing: "-0.4px"}}>Progress</div>
      <div style={{...kicker("var(--color-neutral-700)"), marginTop: "var(--space-4)"}}>Sessions, last eight weeks</div>
      <div style={{display: "flex", alignItems: "flex-end", gap: "var(--space-2)", height: 130, marginTop: "var(--space-3)", borderBottom: "1px solid var(--color-text)"}}>
        {weeks.map((w, i) => (
          <div key={i} style={{flex: 1, display: "flex", flexDirection: "column", justifyContent: "flex-end", alignItems: "center", height: "100%"}}>
            <div className="tabular" style={{fontSize: 12, color: "var(--color-neutral-700)", marginBottom: 4}}>{w.count}</div>
            <div style={{width: "100%", background: "var(--color-accent)", height: w.h}}/>
          </div>
        ))}
      </div>
      <div style={{display: "flex", gap: "var(--space-2)", marginTop: 6}}>
        {weeks.map((w, i) => <div key={i} style={{flex: 1, textAlign: "center", fontSize: 10, color: "var(--color-neutral-700)"}}>{w.label}</div>)}
      </div>
      <div style={{...kicker("var(--color-neutral-700)"), marginTop: "var(--space-8)"}}>Heaviest set on record</div>
      {bestRows.length === 0 && <div style={{fontSize: 15, color: "var(--color-neutral-700)", marginTop: "var(--space-3)"}}>No exercises recorded yet.</div>}
      {bestRows.map(b => (
        <div key={b.name} style={{display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "13px 0", borderBottom: "1px solid var(--color-divider)"}}>
          <div style={{fontSize: 17}}>{b.name}</div>
          <div className="tabular" style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 17}}>{b.best}</div>
        </div>
      ))}
    </div>
  );
}

function Coach({apiKey, saveApiKey, coach, setCoach, coachBusy, coachNote, generate}) {
  const [tempKey, setTempKey] = useState("");
  const [editingKey, setEditingKey] = useState(!apiKey);

  if (editingKey) {
    return (
      <div style={{padding: "28px 20px 0"}}>

        <div style={{fontSize: 15, color: "var(--color-neutral-700)", marginTop: 8, lineHeight: 1.5, textWrap: "pretty"}}>Enter a Claude API key to let Coach build routines for you. Get one at console.anthropic.com.</div>
        <div className="field" style={{marginTop: "var(--space-6)"}}>
          <label>Claude API key</label>
          <input className="input" type="password" placeholder="sk-ant-..." value={tempKey} onChange={e => setTempKey(e.target.value)}/>
        </div>
        <Btn style={{width: "100%", minHeight: 44, marginTop: "var(--space-3)"}} disabled={!tempKey.trim()} onClick={() => { saveApiKey(tempKey); setEditingKey(false); }}>Save key</Btn>
        {apiKey && <Btn variant="ghost" style={{width: "100%", minHeight: 40, marginTop: "var(--space-2)"}} onClick={() => setEditingKey(false)}>Cancel</Btn>}
        <div style={{fontSize: 13, color: "var(--color-neutral-700)", marginTop: "var(--space-3)", lineHeight: 1.5}}>Stored only in this browser tab's session — never saved to IndexedDB.</div>
      </div>
    );
  }

  return (
    <div style={{padding: "28px 20px 0"}}>
      <div style={{fontFamily: "var(--font-heading)", fontWeight: 600, fontSize: 28, letterSpacing: "-0.4px"}}>Ask for a workout</div>
      <div style={{fontSize: 15, color: "var(--color-neutral-700)", marginTop: 8, lineHeight: 1.5, textWrap: "pretty"}}>Three choices and you get a routine you can start straight away.</div>
      <div style={{marginTop: "var(--space-6)", display: "flex", flexDirection: "column", gap: "var(--space-4)"}}>
        <div className="field">
          <label>Time available</label>
          <select className="input" value={coach.minutes} onChange={e => setCoach({...coach, minutes: e.target.value})}>
            <option>20</option><option>30</option><option>45</option><option>60</option>
          </select>
        </div>
        <div className="field">
          <label>Focus</label>
          <select className="input" value={coach.focus} onChange={e => setCoach({...coach, focus: e.target.value})}>
            <option>Full body</option><option>Upper body</option><option>Lower body</option><option>Core</option>
          </select>
        </div>
        <div className="field">
          <label>Equipment</label>
          <select className="input" value={coach.equipment} onChange={e => setCoach({...coach, equipment: e.target.value})}>
            <option>Bodyweight only</option><option>Dumbbells</option><option>Barbell</option><option>Full gym</option>
          </select>
        </div>
      </div>
      <Btn style={{width: "100%", minHeight: 52, fontSize: 17, marginTop: "var(--space-6)"}} disabled={coachBusy} onClick={generate}>{coachBusy ? "Building…" : "Build the workout"}</Btn>
      <Btn variant="ghost" style={{width: "100%", minHeight: 36, marginTop: "var(--space-2)"}} onClick={() => setEditingKey(true)}>Update API key</Btn>
      <div style={{fontSize: 14, color: "var(--color-neutral-700)", marginTop: "var(--space-3)", lineHeight: 1.5}}>{coachNote || "It lands at the top of your workouts, ready to start."}</div>
    </div>
  );
}

        <Btn variant="secondary" style={{width: "100%", minHeight: 44}} onClick={exportCollection}>Export collection</Btn>
      </div>

      <Btn variant="ghost" style={{width: "100%", minHeight: 48, marginTop: "var(--space-6)"}} onClick={resetData}>Reset to sample data</Btn>
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────────────────── */
function App() {
  const [loading, setLoading] = useState(true);
  const [loadedOnce, setLoadedOnce] = useState(false);
  const [routines, setRoutines] = useState([]);
  const [history, setHistory] = useState([]);
  const [prefs, setPrefs] = useState(DEFAULT_PREFS);

  const [screen, setScreen] = useState("home");
  const [activeId, setActiveId] = useState(null);
  const [exIndex, setExIndex] = useState(0);
  const [done, setDone] = useState([]);
  const [logged, setLogged] = useState({});
  const [startedAt, setStartedAt] = useState(null);
  const [paused, setPaused] = useState(false);
  const [pausedMs, setPausedMs] = useState(0);
  const [restShown, setRestShown] = useState(false);
  const [restOn, setRestOn] = useState(false);
  const [restLeft, setRestLeft] = useState(0);
  const [doneSummary, setDoneSummary] = useState("");
  const [openHistory, setOpenHistory] = useState(null);
  const [clockTick, setClockTick] = useState(0);

  const [apiKey, setApiKey] = useState(() => sessionStorage.getItem("claudeApiKey") || "");
  const [coach, setCoach] = useState({minutes: "30", focus: "Full body", equipment: "Dumbbells"});
  const [coachBusy, setCoachBusy] = useState(false);
  const [coachNote, setCoachNote] = useState("");

  useEffect(() => {
    loadAppState().then(s => { setRoutines(s.routines); setHistory(s.history); setPrefs(s.prefs); setLoading(false); setLoadedOnce(true); });
  }, []);

  useEffect(() => { if (loadedOnce) idbReplaceAll("routines", routines).catch(() => {}); }, [routines, loadedOnce]);
  useEffect(() => { if (loadedOnce) idbReplaceAll("history", history).catch(() => {}); }, [history, loadedOnce]);
  useEffect(() => { if (loadedOnce) idbPut("prefs", prefs, "prefs").catch(() => {}); }, [prefs, loadedOnce]);

  useEffect(() => {
    const t = setInterval(() => {
      setClockTick(c => c + 1);
      setRestOn(on => {
        if (!on) return on;
        setRestLeft(left => {
          if (left <= 1) { setRestOn(false); setRestShown(false); return 0; }
          return left - 1;
        });
        return on;
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  const routine = id => routines.find(r => r.id === id);
  const activeRoutine = activeId ? routine(activeId) : null;

  const go = (k, id) => { setScreen(k); if (id !== undefined) setActiveId(id); };

  const begin = (id) => {
    const r = routine(id);
    setScreen("run"); setActiveId(id); setExIndex(0); setDone(r.ex.map(() => 0));
    setStartedAt(Date.now()); setPaused(false); setPausedMs(0);
    setRestShown(false); setRestOn(false); setRestLeft(0); setLogged({});
  };

  const startRest = () => { setRestShown(true); setRestLeft(prefs.secs); setRestOn(prefs.rest === "auto"); };

  const tick = (i) => {
    const r = activeRoutine, ex = r.ex[exIndex];
    const next = done[exIndex] === i + 1 ? i : i + 1;
    setDone(d => { const nd = d.slice(); nd[exIndex] = next; return nd; });
    setLogged(lg => {
      const nlg = {...lg};
      if (next > i) nlg[exIndex + ":" + i] = ex.weight; else delete nlg[exIndex + ":" + i];
      return nlg;
    });
    if (next > i && next < ex.sets) startRest();
    else if (next >= ex.sets) { setRestShown(false); setRestOn(false); }
  };

  const advance = () => {
    const r = activeRoutine;
    if (exIndex + 1 >= r.ex.length) { finish(); return; }
    setDone(d => { const nd = d.slice(); nd[exIndex] = r.ex[exIndex].sets; return nd; });
    setExIndex(i => i + 1); setRestShown(false); setRestOn(false); setRestLeft(0);
  };

  const completeSet = () => {
    const r = activeRoutine, ex = r.ex[exIndex];
    const doneNow = (done[exIndex] || 0) + 1;
    if (doneNow >= ex.sets) { advance(); return; }
    setDone(d => { const nd = d.slice(); nd[exIndex] = doneNow; return nd; });
    setLogged(lg => ({...lg, [exIndex + ":" + (doneNow - 1)]: ex.weight}));
    startRest();
  };

  const bumpWeight = (delta) => {
    setRoutines(rs => rs.map(x => x.id !== activeId ? x : {...x, ex: x.ex.map((e, j) => j !== exIndex ? e : {...e, weight: Math.max(0, e.weight + delta)})}));
  };
  const bumpReps = (delta) => {
    setRoutines(rs => rs.map(x => x.id !== activeId ? x : {...x, ex: x.ex.map((e, j) => j !== exIndex ? e : {...e, reps: Math.max(1, e.reps + delta)})}));
  };

  const finish = () => {
    const r = activeRoutine;
    const mins = Math.max(1, Math.round((Date.now() - (startedAt || Date.now())) / 60000));
    const iso = new Date().toISOString().slice(0, 10);
    const setsDone = done.reduce((a, b) => a + b, 0) + (r.ex[exIndex].sets - (done[exIndex] || 0));
    const detail = r.ex.map(e => ({name: e.name, target: e.sets + " × " + target(e)}));
    setHistory(h => sortHistory([{id: "h" + Date.now(), date: iso, name: r.name, sets: setsDone, mins, detail, ts: Date.now()}, ...h]));
    setRoutines(rs => rs.map(x => x.id === r.id ? {...x, last: iso} : x));
    setDoneSummary(setsDone + " sets · " + mins + " min");
    setRestOn(false); setRestShown(false);
    setScreen("done");
  };

  const sessionToggle = () => {
    if (paused) { setPaused(false); setStartedAt(Date.now() - pausedMs); }
    else { setPaused(true); setPausedMs(Date.now() - (startedAt || Date.now())); }
  };
  const sessMs = paused ? pausedMs : Date.now() - (startedAt || Date.now());
  const sessSec = Math.max(0, Math.floor(sessMs / 1000));
  const sessionClock = String(Math.floor(sessSec / 60)).padStart(2, "0") + ":" + String(sessSec % 60).padStart(2, "0");

  const restAction = () => {
    if (restOn) { setRestOn(false); }
    else { setRestOn(true); setRestLeft(l => l || prefs.secs); }
  };
  const restSkip = () => { setRestOn(false); setRestShown(false); setRestLeft(0); };

  const saveApiKey = (key) => { sessionStorage.setItem("claudeApiKey", key); setApiKey(key); };

  const generate = async () => {
    if (!apiKey) return;
    setCoachBusy(true); setCoachNote("");
    try {
      const r = await callClaudeForRoutine(apiKey, coach);
      setRoutines(rs => [r, ...rs]);
      setActiveId(r.id); setScreen("preview");
      setCoachNote("Added to your workouts.");
    } catch (err) {
      setCoachNote(err.message || "Couldn't generate a workout. Try again.");
    } finally {
      setCoachBusy(false);
    }
  };

  const removeRoutine = (id) => setRoutines(rs => rs.filter(x => x.id !== id));
  const removeHistory = (id) => { setHistory(h => h.filter(x => x.id !== id)); setOpenHistory(o => o === id ? null : o); };
  const resetData = () => { setRoutines(JSON.parse(JSON.stringify(SEED_ROUTINES))); setHistory(sortHistory(SEED_HISTORY)); setScreen("home"); };

  const exportCollection = () => {
    const payload = {app: "the-daily-lift", version: 2, exportedAt: new Date().toISOString(), routines, history, prefs};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `daily-lift-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const chromeOn = screen !== "run" && screen !== "done";

  if (loading) {
    return <div style={{minHeight: "100vh", display: "flex", justifyContent: "center", background: "var(--color-neutral-300)"}}>
      <div style={{width: "100%", maxWidth: 430, background: "var(--color-bg)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, color: "var(--color-neutral-700)"}}>Loading…</div>
    </div>;
  }

  return (
    <div style={{minHeight: "100vh", display: "flex", justifyContent: "center", background: "var(--color-neutral-300)"}}>
      <div style={{width: "100%", maxWidth: 430, minHeight: "100vh", background: "var(--color-bg)", position: "relative", paddingBottom: 84}}>
        {chromeOn && <Masthead sessionsLogged={history.length}/>}

        {screen === "home" && <Home routines={routines} go={go} begin={begin}/>}
        {screen === "preview" && <Preview routine={activeRoutine} go={go} startActive={() => begin(activeId)}/>}
        {screen === "run" && (
          <Run routine={activeRoutine} exIndex={exIndex} done={done} logged={logged} prefs={prefs}
            quitRun={finish} sessionClock={sessionClock} sessionPaused={paused} sessionToggle={sessionToggle}
            weightUp={() => bumpWeight(5)} weightDown={() => bumpWeight(-5)} repsUp={() => bumpReps(1)} repsDown={() => bumpReps(-1)}
            primaryAction={completeSet} skipAction={advance} tick={tick}
            restShown={restShown} restOn={restOn} restLeft={restLeft} restAction={restAction} restSkip={restSkip}/>
        )}
        {screen === "done" && <Done routine={activeRoutine} doneSummary={doneSummary} goHome={() => setScreen("home")}/>}
        {screen === "history" && <History history={history} openId={openHistory} setOpenId={setOpenHistory} removeHistory={removeHistory}/>}
        {screen === "progress" && <Progress routines={routines} history={history}/>}
        {screen === "coach" && <Coach apiKey={apiKey} saveApiKey={saveApiKey} coach={coach} setCoach={setCoach} coachBusy={coachBusy} coachNote={coachNote} generate={generate}/>}
        {screen === "settings" && <Settings prefs={prefs} setPrefs={setPrefs} routines={routines} removeRoutine={removeRoutine} resetData={resetData} exportCollection={exportCollection}/>}

        {chromeOn && <TabBar screen={screen} onGo={go}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
